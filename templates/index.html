<!DOCTYPE html>
<html>
<head>
    <title>TrashNet Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
        }

        h1 {
            color: #2e7d32;
        }

        form {
            margin: 30px 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>♻️ TrashNet Classifier</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <h2>Prediction: {{ prediction }}</h2>
        <h3>Confidence: {{ "%.2f"|format(confidence) }}%</h3>
    {% endif %}

</body>
</html>
